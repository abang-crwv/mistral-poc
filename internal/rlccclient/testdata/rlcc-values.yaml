#
# This is a HAND-ROLLED MINIMAL slice for the iter-5a drift-prevention
# test. It contains three workflows (one full bringup, two state-movers)
# transcribed from the iter-5a spec §3.1 excerpt. A full 21-entry refresh
# from the live chart is procedure-documented in
# docs/superpowers/specs/2026-05-30-fwqual-iter5a-design.md §10.
rlcc:
  workflows:
    - name: gb200-rack-bringup-v4
      description: Rack Bringup V4 for GB200.
      lifecycle: stable
      current-states:
        - checked-in
        - onboarding
      desired-state: ready
      actions:
        - name: await-cdu-ps-init
          handler: await-checkpoint
          description: Wait for CDU and PSes to be inited
          arguments:
            checkpoint: rack
            components:
              coolantdistributionunit:
                checks: [count, init]
              powershelf:
                checks: [count, init]
        - name: gb200-cdu-ps-provision-v4
          handler: hlcc-state
          description: Provision CDU and PSes
          arguments:
            components:
              coolantdistributionunit: {state: Provision}
              powershelf: {state: Provision}
        - name: await-cdu-ps-provision-v4
          handler: await-checkpoint
          description: Wait for all rack CDU and PS provisioning to complete
          arguments:
            checkpoint: rack
            components:
              coolantdistributionunit:
                checks: [available, count, healthy, init]
        - name: gb200-rack-provision-v4
          handler: provision
          description: Zap all rack provision phase components for bringup v4
          arguments:
            checkpoint: rack
            checkpoint-args-step: await-rack-provision-v4
            components:
              computetray: {workflow: gb200-rack-provision-v4}
              nvlink:      {workflow: Provision}
        - name: await-rack-provision-v4
          handler: await-checkpoint
          description: Wait for all rack provisioning to complete
          arguments:
            checkpoint: rack
            components:
              coolantdistributionunit:
                workflow: Provision
                checks: [provisionable, workflow, count, healthy, init]
              nvlink:
                workflow: Provision
                checks: [provisionable, workflow, count, healthy, init]
              powershelf:
                workflow: Provision
                checks: [provisionable, workflow, count, healthy, init]
              computetray:
                flcc-end-state: l10-test-loop
                workflow: gb200-rack-provision-v4
                checks: [count, workflow]
        - name: gb200-l11-fielddiag
          handler: l11-fielddiag
          description: Run L11 rack fielddiag via AWX
        - name: gb200-rack-hpc-verification-v4
          handler: hpc-verification
          description: Run HPC Verification for entire rack via the gb200-rack-hpc-verification-v4 workflow in FLCC
          arguments:
            checkpoint: rack
            checkpoint-args-step: await-gb200-rack-hpc-verification
            components:
              computetray: {workflow: gb200-rack-hpc-verification-v4}
        - name: await-gb200-rack-hpc-verification
          handler: await-checkpoint
          description: Wait for all rack HPC verification to complete
          arguments:
            checkpoint: rack
            components:
              computetray:
                flcc-end-state: l12-test-loop
                workflow: gb200-rack-hpc-verification-v4
                checks: [count, workflow]
        - name: move-bmns-to-ready
          handler: flcc-workflow
          description: Move all CTs to ready
          arguments:
            checkpoint: rack
            checkpoint-args-step: await-move-bmns-to-ready
            components:
              computetray: {workflow: ready}
        - name: await-move-bmns-to-ready
          handler: await-checkpoint
          description: Wait for all CTs to reach ready
          arguments:
            checkpoint: rack
            components:
              computetray:
                flcc-end-state: ready
                workflow: ready
                checks: [count, workflow]
    - name: ready
      description: Rack is ready
      lifecycle: stable
      desired-state: ready
    - name: checked-in
      description: Rack checked in (no-op)
      lifecycle: stable
      desired-state: checked-in
