# Hand-rolled minimal slice covering the four FLCC workflows referenced by
# gb200-rack-bringup-v4 in the RLCC chart. Full refresh procedure lives in
# the iter-5a spec §10.
flcc:
  config:
    workflows:
      - name: gb200-rack-provision-v4
        class: rack-provision
        description: |
          Node+DPU vaultify, seatrial then zap both dpu and host.
          Part of rack bringup and CT upgrade v4.
        phases:
          - name: node-vaultify
            state: node-vaultify
            failState: fail
            timeout: 1h
          - name: power-cycle
            state: power-cycle
            failState: fail
            timeout: 30m
            parameters:
              instant-start: "true"
              no-wait-k8s-node: "true"
              no-dpu-readiness-check: "true"
          - name: dpu-vaultify
            state: dpu-vaultify
            failState: fail
            timeout: 1h
          - name: dpu-zap
            state: dpu-zap
            failState: fail
            requeueTime: 30s
            timeout: 6h
          - name: zap-seatrial
            state: zap-seatrial
            failState: fail
            timeout: 1h
            parameters:
              duration: 30m
              startbuffer: 20m
          - name: backend-down
            state: backend-down
          - name: node-zap
            state: node-zap
            failState: fail
            timeout: 6h
          - name: node-zap-reboot
            state: power-cycle
            timeout: 1h
            parameters:
              instant-start: "true"
          - name: backend-up
            state: backend-up
          - name: castle-verify
            state: castle-verify
            failState: fail
            timeout: 10m
          - name: fielddiag
            state: fielddiag
            failState: fail
            timeout: 18h
          - name: fielddiag-reboot
            state: power-cycle
            timeout: 1h
            parameters:
              instant-start: "true"
          - name: l10-test
            state: l10-test
            failState: fail
            requeueTime: 10m
            timeout: 10h
            parameters:
              duration: 9h
          - name: l10-test-loop
            state: l10-test-loop
      - name: gb200-rack-power-cycle
        class: rack-provision
        description: Power cycle a Compute Tray (CT). Used specifically during rack bringup.
        phases:
          - name: power-cycle
            state: power-cycle
            timeout: 1h
            parameters:
              instant-start: "true"
          - name: hold
            state: hold
      - name: gb200-rack-hpc-verification-v4
        class: rack-provision
        description: L11 testing of a rack's CTs (power-cycle, then 24h group hpc-verf).
        phases:
          - name: node-l11-reboot
            state: power-cycle
            timeout: 1h
            parameters:
              instant-start: "true"
          - name: l11-test
            state: l11-test
            failState: fail
            requeueTime: 10m
            timeout: 10h
            parameters:
              duration: 9h
          - name: l12-seatrial
            state: l12-seatrial
            failState: fail
            timeout: 1h
            parameters:
              duration: 30m
              startbuffer: 20m
          - name: l12-test
            state: l12-test
            failState: fail
            requeueTime: 10m
            timeout: 10h
            parameters:
              duration: 9h
          - name: l12-test-loop
            state: l12-test-loop
      - name: ready
        class: node-provision
        description: A workflow for marking a node as ready.
        phases:
          - name: ready
            state: ready
