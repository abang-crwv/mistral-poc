# Pre-zap baseline canary — the first phase of firmware-release-canary,
# carved out as its own template so operators can trial-and-error the
# pre-zap health snapshot (alert baseline + inventory facts + baseline_pre)
# without the run walking into the zap / L10 / L11 / L12 pipeline.
#
# The full pipeline lives in firmware-release-canary.yaml; this template is
# a strict prefix of it (first three steps, verbatim). When the baseline
# phase is solid, its steps fold back into the full canary.
schema: qac.template/v1
id: firmware-prezap-baseline
version: 2
title: FW pre-zap baseline
target:
  scope: rack
  instance_types:
    - gb200-4x
    - gb300-4x
inputs:
  - id: bundle_tag
    label: FW bundle tag
    type: text
    required: true
    example: dell-xe9712-default-2.0.0-rc
  - id: canary_racks
    label: Canary racks
    type: multi_text
    required: true
    validate: ^[a-z]+\d+-r\d{3}-[a-z]+-[a-z]+-\d{2}[a-z]$
  - id: requester
    label: 'Requester (from #havock)'
    type: text
    required: false
  # rlcc_workflow is only needed by the L11 walk in the full canary; the
  # baseline phase never uses it. Kept optional so the existing new-run
  # modal's payload still validates.
  - id: rlcc_workflow
    label: RLCC bringup workflow
    type: text
    required: false
    example: gb200-rack-bringup-v4
steps:
  - id: alert_baseline
    kind: probe
    probe_type: alert_probe
    title: Pre-zap alert baseline
    racks: '{{ inputs.canary_racks }}'
    timeout: 30s
  - id: firmware_baseline
    kind: probe
    probe_type: firmware_inventory_probe
    title: Pre-zap firmware inventory snapshot
    racks: '{{ inputs.canary_racks }}'
    timeout: 30s
  - id: baseline_pre
    kind: probe
    title: "Baseline — pre-zap health snapshot"
    action:
      tool: metrics
      args:
        racks: '{{ inputs.canary_racks }}'
        mode: pre
      timeout: 5m
    checkpoint:
      targets: per_rack
      success_when:
        stdout_contains: baseline_ok
