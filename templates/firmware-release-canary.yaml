schema: qac.template/v1
id: firmware-release-canary
version: 11
title: "FW release canary"

target:
  scope: rack
  instance_types: [gb200-4x, gb300-4x]

inputs:
  - id: bundle_tag
    label: "FW bundle tag"
    type: text
    required: true
    example: "dell-xe9712-default-2.0.0-rc"

  - id: canary_racks
    label: "Canary racks"
    type: multi_text
    required: true
    # Canonical CoreWeave rack format (post-2025-07-02 rename). Mirrored
    # in internal/api/runs_validate.go (Go) and
    # web/src/features/runs/newRunSchema.ts (TS).
    validate: "^[a-z]+\\d+-r\\d{3}-[a-z]+-[a-z]+-\\d{2}[a-z]$"

  - id: requester
    label: "Requester (from #havock)"
    type: text
    required: false
    # required:false until iter-3b's dynamic form lands; the iter-2
    # legacy {bundle, rack} modal can't supply it. instance_type/variant
    # were removed in iter-4a (now inventory-discovered); nitwit_receipts
    # and slack_thread were removed (no producer in iter-4a).

  - id: rlcc_workflow
    label: "RLCC bringup workflow"
    type: text
    required: true
    example: "gb200-rack-bringup-v4"
    # Flipped to required:true in iter-5d (template version 7). The
    # handler now resolves the picked workflow via rlccclient.GetWorkflow
    # at run-create and inlines a snapshot ({name, source_sha, actions[]})
    # into RunCreated.payload.rlcc_workflow. iter-5e's rlcc_action_probe
    # reads the snapshot from the event log when walking per-CT actions.

steps:
  - id: alert_baseline
    kind: probe
    probe_type: alert_probe
    title: "Pre-zap alert baseline"
    racks: "{{ inputs.canary_racks }}"
    timeout: 30s

  - id: firmware_baseline
    kind: probe
    probe_type: firmware_inventory_probe
    title: "Pre-zap firmware inventory snapshot"
    racks: "{{ inputs.canary_racks }}"
    timeout: 30s

  - id: baseline_pre
    kind: probe
    title: "Baseline — pre-zap health snapshot"
    action:
      tool: metrics
      args:
        racks: "{{ inputs.canary_racks }}"
        mode: pre
      timeout: 5m
    checkpoint:
      targets: per_rack
      success_when: { stdout_contains: "baseline_ok" }

  - id: zap_canary
    kind: probe
    title: "Zap canary rack(s) — FLCC node-zap workflow"
    action:
      tool: flcc
      multi_rack: true
      parallelism: all
      args: ["workflow", "run", "node-zap",
             "--rack", "{{ rack }}",
             "--bundle", "{{ inputs.bundle_tag }}",
             "--json"]
      timeout: 60m
    checkpoint:
      targets: per_rack
      success_when: { json_field: "status", equals: "completed" }
      fail_when:    { json_field: "status", equals: "failed" }
      blockers:
        - kind: ActionRequired
          when: { json_field: "status", equals: "halted" }
          message: "node-zap halted; manual intervention required"

  - id: l10_fielddiag
    kind: probe
    title: "L10 fielddiag — NVIDIA single-tray GPU screening"
    action:
      tool: flcc
      args: ["state", "report", "--racks", "{{ inputs.canary_racks | join:',' }}",
             "--state", "l10-fielddiag", "--json"]
      timeout: 18h
    checkpoint:
      targets: per_rack
      success_when: { json_field: "state.completed", equals: true }

  - id: l10_check
    kind: probe
    title: "L10 test — node-level HPC verification"
    action:
      tool: flcc
      args: ["state", "report", "--racks", "{{ inputs.canary_racks | join:',' }}",
             "--state", "l10-test", "--include-alerts", "--json"]
      timeout: 9h
    checkpoint:
      targets: per_rack
      success_when: { json_field: "state.completed", equals: true }

  - id: l11_fielddiag            # id unchanged → evidence_review/ai_summary refs stay valid
    kind: probe
    probe_type: rlcc_action_probe
    title: "L11 fielddiag — whole-rack NVLink-domain diagnostic (per-CT walk)"
    racks: "{{ inputs.canary_racks }}"
    action:
      tool: rlcc                 # vestigial; the probe ignores tool (iter-5f Approach A wart)
      args:                      # map form → runner maps into StepContext.Config
        match_handler: l11-fielddiag
        target_state: l11-fielddiag
        poll_interval: 30s
        evaluation_unit: nvlink-domain
    timeout: 4h

  - id: l11_check
    kind: probe
    title: "L11 test — NVLink-domain group test"
    action:
      tool: rlcc
      args: ["state", "report", "--racks", "{{ inputs.canary_racks | join:',' }}",
             "--state", "l11-test", "--include-alerts", "--json"]
      timeout: 6h
    checkpoint:
      targets: per_rack
      success_when: { json_field: "state.completed", equals: true }

  - id: l12_seatrial
    kind: probe
    title: "L12 seatrial — backend misconnect screen"
    action:
      tool: rlcc
      args: ["state", "report", "--racks", "{{ inputs.canary_racks | join:',' }}",
             "--state", "l12-seatrial", "--json"]
      timeout: 1h
    checkpoint:
      targets: per_rack
      success_when: { json_field: "state.completed", equals: true }

  - id: l12_check
    kind: probe
    title: "L12 test — backend IB/RoCE fabric performance"
    action:
      tool: rlcc
      args: ["state", "report", "--racks", "{{ inputs.canary_racks | join:',' }}",
             "--state", "l12-test", "--include-alerts", "--json"]
      timeout: 6h
    checkpoint:
      targets: per_rack
      success_when: { json_field: "state.completed", equals: true }

  - id: baseline_post
    kind: probe
    title: "Baseline — post-zap delta vs baseline_pre"
    action:
      tool: metrics
      args:
        racks: "{{ inputs.canary_racks }}"
        mode: post
        compare_to: "step:baseline_pre"
      timeout: 5m
    checkpoint:
      targets: per_rack
      success_when: { stdout_contains: "delta_within_threshold" }

  - id: fail_cause
    kind: probe
    probe_type: fail_cause_probe
    title: "Fail-cause correlation — alerts on failed L11 trays"
    racks: "{{ inputs.canary_racks }}"
    action:
      args:                      # map form → runner maps into StepContext.Config
        fail_step: l11_fielddiag
    timeout: 1m

  - id: evidence_review
    kind: review
    title: "Per-rack evidence review"
    sources:
      - baseline_pre
      - zap_canary
      - l10_fielddiag
      - l10_check
      - l11_fielddiag
      - l11_check
      - l12_seatrial
      - l12_check
      - baseline_post
      - fail_cause
    enrichment:
      patterns: true
      glean: true
    optional_inputs:
      - id: rack_notes
        label: "Rack notes"
        type: textarea
        required: false

  - id: ai_summary
    kind: ai_assess
    title: "AI assessment of canary outcome"
    prompt_ref: fw-release-canary.summary.v1
    context_steps: [baseline_pre, zap_canary,
                    l10_fielddiag, l10_check, l11_fielddiag, l11_check,
                    l12_seatrial, l12_check, baseline_post, fail_cause]
    respect_suppressions: true
    cite_patterns: true
    cite_glean: true
    expected_verdict: [pass, fail, needs_review]

  - id: operator_signoff
    kind: signoff
    title: "Operator sign-off"
    final_verdict_options: [pass, fail]
    fields:
      - { id: signer_name, label: "Operator name", type: text,     required: true }
      - { id: signer_role, label: "Role",          type: text,     required: true }
      - { id: final_notes, label: "Final notes",   type: textarea, required: false }
    slack_reply: true
