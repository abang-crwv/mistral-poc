<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>New Run Wizard — preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  body { background: #fafafa; }
  .note { font-feature-settings: "tnum"; }
</style>
</head>
<body class="text-zinc-900 antialiased">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

// ---- fixture data (mirrors src/mocks/handlers.ts) ----
const TEMPLATE = {
  id: 'firmware-release-canary', version: 5, title: 'FW release canary',
  inputs: [
    { id: 'bundle_tag', label: 'FW bundle tag', type: 'text', required: true, example: 'dell-xe9712-default-2.0.0-rc' },
    { id: 'canary_racks', label: 'Canary racks', type: 'multi_text', required: true, validate: '^dh\\d+-r\\d{3}-[a-z]+-[a-z]+-\\d{2}[a-z]$', example: 'dh3-r012-us-east-01a' },
    { id: 'requester', label: 'Requester (from #havock)', type: 'text', required: false },
  ],
};
function mkRack(rack, instance, sku, zone, cts) {
  const bmns = Array.from({ length: cts }, (_, i) => ({
    deviceslot: `ct-${String(i + 1).padStart(2, '0')}`,
    bmn_name: `${rack}-bmn-${String(i + 1).padStart(2, '0')}`, ct_position: i + 1,
  }));
  return { rack, zone, instance_type: instance, sku, bmns, rlcc_ignored: cts > 6 ? [{ deviceslot: 'ct-04' }] : [] };
}
const KNOWN = {
  'dh3-r012-us-east-01a': mkRack('dh3-r012-us-east-01a', 'gb200-4x', 'XE9712-GB200-NVL72', 'us-east-01a', 8),
  'dh3-r014-us-east-01a': mkRack('dh3-r014-us-east-01a', 'gb200-4x', 'XE9712-GB200-NVL72', 'us-east-01a', 6),
  'dh4-r066-us-east-11a': mkRack('dh4-r066-us-east-11a', 'gb300-4x', 'XE9680-GB300', 'us-east-11a', 8),
};
const RLCC = [{ name: 'gb200-rack-bringup-v4', rack_kind: 'gb200-4x', action_count: 14, desired_state: 'l12-test' }];

const STEP_ORDER = ['inputs', 'inventory', 'review'];
const STEP_LABELS = { inputs: 'Inputs', inventory: 'Inventory', review: 'Review' };
const splitMulti = (s) => s.split(/[\n,]+/).map((x) => x.trim()).filter(Boolean);

function coerce(raw) {
  const out = {};
  for (const inp of TEMPLATE.inputs) {
    const v = raw[inp.id] ?? '';
    if (inp.type === 'multi_text') { const l = splitMulti(v); if (l.length || inp.required) out[inp.id] = l; }
    else { const t = v.trim(); if (t || inp.required) out[inp.id] = t; }
  }
  return out;
}
function validate(raw) {
  const errs = {};
  for (const inp of TEMPLATE.inputs) {
    const re = inp.validate ? new RegExp(inp.validate) : null;
    if (inp.type === 'multi_text') {
      const list = splitMulti(raw[inp.id] ?? '');
      if (inp.required && list.length === 0) errs[inp.id] = `${inp.label} is required`;
      else if (re && !list.every((s) => re.test(s))) errs[inp.id] = `${inp.label}: one or more values are not in the expected format (example: ${inp.example})`;
    } else {
      const v = (raw[inp.id] ?? '').trim();
      if (inp.required && !v) errs[inp.id] = `${inp.label} is required`;
      else if (v && re && !re.test(v)) errs[inp.id] = `${inp.label} is not in the expected format`;
    }
  }
  return errs;
}

const Badge = ({ tone = 'neutral', children }) => {
  const tones = { neutral: 'bg-zinc-100 text-zinc-700', info: 'bg-blue-100 text-blue-700', warn: 'bg-amber-100 text-amber-800' };
  return <span className={`inline-flex items-center rounded px-2 py-0.5 text-xs font-medium ${tones[tone]}`}>{children}</span>;
};

const baseField = 'w-full rounded border px-3 py-2 text-sm';

function StepInputs({ raw, errors, onChange }) {
  return (
    <div className="space-y-4">
      {TEMPLATE.inputs.map((inp) => {
        const err = errors[inp.id];
        const cls = `${baseField} ${err ? 'border-red-400' : 'border-zinc-300'} font-mono`;
        return (
          <div key={inp.id}>
            <label className="mb-1 block text-sm font-medium" htmlFor={`f-${inp.id}`}>
              {inp.label}{inp.required && <span className="ml-0.5 text-red-600">*</span>}
            </label>
            {inp.type === 'multi_text'
              ? <textarea id={`f-${inp.id}`} rows={2} className={cls} placeholder={inp.example} value={raw[inp.id] ?? ''} onChange={(e) => onChange(inp.id, e.target.value)} />
              : <input id={`f-${inp.id}`} type="text" className={cls} placeholder={inp.example} value={raw[inp.id] ?? ''} onChange={(e) => onChange(inp.id, e.target.value)} />}
            {inp.type === 'multi_text' && <p className="mt-1 text-xs text-zinc-500">Comma- or newline-separated for multiple.</p>}
            {err && <p className="mt-1 text-xs text-red-700">{err}</p>}
          </div>
        );
      })}
      <div className="rounded border border-blue-200 bg-blue-50 p-3 text-xs text-blue-900">
        Instance type, SKU, and variant are discovered from inventory per rack in the next step — you don’t enter them here.
      </div>
    </div>
  );
}

function StepInventory({ racks, ignored, toggle, setReason }) {
  const resolved = racks.filter((r) => KNOWN[r]).map((r) => KNOWN[r]);
  const errors = racks.filter((r) => !KNOWN[r]);
  const [open, setOpen] = useState(false);
  return (
    <div className="space-y-3">
      {errors.length > 0 && (
        <div className="rounded border border-red-200 bg-red-50 p-3 text-sm text-red-800">
          <p className="font-medium">These racks could not be resolved:</p>
          <ul className="mt-1 space-y-0.5">{errors.map((r) => <li key={r} className="font-mono text-xs">{r} — rack not found</li>)}</ul>
          <p className="mt-1 text-xs">Fix the rack list in the previous step before creating the run.</p>
        </div>
      )}
      {resolved.map((rk) => {
        const rlccSlots = new Set((rk.rlcc_ignored || []).map((i) => i.deviceslot));
        return (
          <div key={rk.rack} className="rounded border border-zinc-200">
            <div className="flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-zinc-100 px-3 py-2">
              <span className="font-mono text-sm font-medium">{rk.rack}</span>
              <span className="text-xs text-zinc-500">{rk.zone}</span>
              <Badge tone="info">{rk.instance_type}</Badge>
              <span className="font-mono text-xs text-zinc-500">{rk.sku}</span>
              <span className="ml-auto text-xs text-zinc-500">{rk.bmns.length} CTs</span>
              {rlccSlots.size > 0 && <Badge tone="warn">{rlccSlots.size} ignored in RLCC</Badge>}
            </div>
            <table className="w-full border-collapse text-sm">
              <thead><tr className="border-b border-zinc-100 text-left text-xs text-zinc-500">
                <th className="px-3 py-1.5 font-medium">Ignore</th><th className="px-3 py-1.5 font-medium">Deviceslot</th><th className="px-3 py-1.5 font-medium">BMN</th><th className="px-3 py-1.5 font-medium">Reason</th>
              </tr></thead>
              <tbody>
                {rk.bmns.map((b) => {
                  const rlccIgnored = rlccSlots.has(b.deviceslot);
                  const entry = ignored.find((i) => i.rack === rk.rack && i.deviceslot === b.deviceslot);
                  const checked = rlccIgnored || !!entry;
                  return (
                    <tr key={b.deviceslot} className="border-b border-zinc-50">
                      <td className="px-3 py-1.5"><input type="checkbox" checked={checked} disabled={rlccIgnored} onChange={() => toggle(rk.rack, b.deviceslot)} /></td>
                      <td className="px-3 py-1.5 font-mono text-xs">{b.deviceslot}</td>
                      <td className="px-3 py-1.5 font-mono text-xs text-zinc-600">{b.bmn_name}{rlccIgnored && <span className="ml-2 text-amber-700">RLCC</span>}</td>
                      <td className="px-3 py-1.5">{entry && !rlccIgnored && <input type="text" className="w-full rounded border border-zinc-300 px-2 py-1 text-xs" placeholder="Reason (optional)" value={entry.reason ?? ''} onChange={(e) => setReason(rk.rack, b.deviceslot, e.target.value)} />}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        );
      })}
      <div className="rounded border border-zinc-200">
        <button type="button" onClick={() => setOpen((o) => !o)} className="w-full px-3 py-2 text-left text-sm font-medium text-zinc-700">
          {open ? '▾' : '▸'} RLCC bringup workflows <span className="ml-1 text-xs font-normal text-zinc-400">(fixture)</span>
        </button>
        {open && <ul className="space-y-1 border-t border-zinc-100 px-3 py-2 text-xs text-zinc-600">{RLCC.map((w) => <li key={w.name} className="flex justify-between gap-3"><span className="font-mono">{w.name}</span><span className="text-zinc-400">{w.rack_kind} · {w.action_count} actions · → {w.desired_state}</span></li>)}</ul>}
      </div>
    </div>
  );
}

function StepReview({ raw, racks, ignored }) {
  const inputs = coerce(raw);
  const resolved = racks.filter((r) => KNOWN[r]).map((r) => KNOWN[r]);
  return (
    <div className="space-y-5 text-sm">
      <section>
        <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-zinc-500">Template</h3>
        <p>{TEMPLATE.title} <span className="text-zinc-400">v{TEMPLATE.version}</span> <span className="font-mono text-xs text-zinc-500">{TEMPLATE.id}</span></p>
      </section>
      <section>
        <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-zinc-500">Inputs</h3>
        <dl className="grid grid-cols-[max-content_1fr] gap-x-6 gap-y-1">
          {TEMPLATE.inputs.map((inp) => { const v = inputs[inp.id]; const s = Array.isArray(v) ? v.join(', ') : (v || '—'); return (
            <div key={inp.id} className="contents"><dt className="text-zinc-500">{inp.label}</dt><dd className="font-mono text-xs">{s}</dd></div>
          ); })}
        </dl>
      </section>
      {resolved.length > 0 && (
        <section>
          <h3 className="mb-1 text-xs font-semibold uppercase tracking-wide text-zinc-500">Discovered inventory</h3>
          <table className="w-full border-collapse">
            <thead><tr className="border-b border-zinc-200 text-left text-xs text-zinc-500"><th className="px-2 py-1 font-medium">Rack</th><th className="px-2 py-1 font-medium">Instance</th><th className="px-2 py-1 font-medium">SKU</th><th className="px-2 py-1 font-medium">CTs</th><th className="px-2 py-1 font-medium">Ignored</th></tr></thead>
            <tbody>{resolved.map((r) => { const rlccCount = (r.rlcc_ignored || []).length; const opCount = ignored.filter((i) => i.rack === r.rack).length; return (
              <tr key={r.rack} className="border-b border-zinc-50"><td className="px-2 py-1 font-mono text-xs">{r.rack}</td><td className="px-2 py-1 text-xs">{r.instance_type}</td><td className="px-2 py-1 font-mono text-xs text-zinc-500">{r.sku}</td><td className="px-2 py-1 text-xs">{r.bmns.length}</td><td className="px-2 py-1 text-xs text-zinc-500">{opCount + rlccCount === 0 ? '—' : `${opCount} operator · ${rlccCount} RLCC`}</td></tr>
            ); })}</tbody>
          </table>
        </section>
      )}
      <p className="text-xs text-zinc-500">Creating the run posts to <span className="font-mono">POST /api/runs</span> and kicks the engine. You’ll be taken to the run detail page.</p>
    </div>
  );
}

function Wizard({ onClose, onCreated }) {
  const [step, setStep] = useState('inputs');
  const [raw, setRaw] = useState({});
  const [ignored, setIgnored] = useState([]);
  const [errors, setErrors] = useState({});
  const racks = useMemo(() => { const c = coerce(raw)['canary_racks']; return Array.isArray(c) ? c : []; }, [raw]);
  const previewBlocked = racks.length === 0 || racks.some((r) => !KNOWN[r]);

  const onChange = (id, value) => { setRaw((p) => ({ ...p, [id]: value })); setErrors((p) => (p[id] ? { ...p, [id]: '' } : p)); };
  const toggle = (rack, ds) => setIgnored((p) => p.find((i) => i.rack === rack && i.deviceslot === ds) ? p.filter((i) => !(i.rack === rack && i.deviceslot === ds)) : [...p, { rack, deviceslot: ds }]);
  const setReason = (rack, ds, reason) => setIgnored((p) => p.map((i) => i.rack === rack && i.deviceslot === ds ? { ...i, reason } : i));
  const next = () => { const e = validate(raw); if (Object.keys(e).length) { setErrors(e); return; } setErrors({}); setStep('inventory'); };

  const ghost = 'rounded border border-zinc-300 px-3 py-1.5 text-sm font-medium hover:bg-zinc-50';
  const primary = 'rounded bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800 disabled:opacity-50';

  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center bg-black/40 p-6 overflow-auto" onClick={onClose}>
      <div className="mt-8 w-[44rem] max-w-[95vw] rounded-lg bg-white p-6 shadow-xl" onClick={(e) => e.stopPropagation()}>
        <div className="mb-4 flex items-center justify-between"><h2 className="text-lg font-semibold">New canary run</h2><button onClick={onClose} className="rounded p-1 text-zinc-500 hover:bg-zinc-100">✕</button></div>
        <ol className="mb-5 flex items-center gap-2 text-xs">
          {STEP_ORDER.map((s, i) => { const active = s === step; const done = STEP_ORDER.indexOf(step) > i; return (
            <li key={s} className="flex items-center gap-2">
              <span className={`flex h-5 w-5 items-center justify-center rounded-full text-[11px] ${active ? 'bg-zinc-900 text-white' : done ? 'bg-zinc-300 text-zinc-700' : 'bg-zinc-100 text-zinc-400'}`}>{i + 1}</span>
              <span className={active ? 'font-medium text-zinc-900' : 'text-zinc-400'}>{STEP_LABELS[s]}</span>
              {i < STEP_ORDER.length - 1 && <span className="text-zinc-300">→</span>}
            </li>
          ); })}
        </ol>
        {step === 'inputs' && <StepInputs raw={raw} errors={errors} onChange={onChange} />}
        {step === 'inventory' && <StepInventory racks={racks} ignored={ignored} toggle={toggle} setReason={setReason} />}
        {step === 'review' && <StepReview raw={raw} racks={racks} ignored={ignored} />}
        <div className="mt-6 flex justify-end gap-2">
          {step === 'inputs' && <><button className={ghost} onClick={onClose}>Cancel</button><button className={primary} onClick={next}>Next</button></>}
          {step === 'inventory' && <><button className={ghost} onClick={() => setStep('inputs')}>Back</button><button className={primary} disabled={previewBlocked} onClick={() => setStep('review')}>Next</button></>}
          {step === 'review' && <><button className={ghost} onClick={() => setStep('inventory')}>Back</button><button className={primary} onClick={() => onCreated(coerce(raw), ignored)}>Create run</button></>}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [open, setOpen] = useState(true);
  const [toast, setToast] = useState(null);
  return (
    <main className="mx-auto max-w-3xl p-8">
      <div className="mb-2 flex items-center gap-2">
        <h1 className="text-2xl font-semibold">Runs</h1>
        <span className="rounded bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-800">preview · mock data</span>
      </div>
      <p className="mb-6 text-sm text-zinc-500">Clickable mock of the New Run wizard. Try racks <span className="font-mono">dh3-r012-us-east-01a</span> (resolves) and a bad one like <span className="font-mono">as1-r07</span> (rejected).</p>
      <button onClick={() => setOpen(true)} className="rounded bg-zinc-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-zinc-800">New run</button>
      {toast && <div className="mt-4 rounded border border-green-200 bg-green-50 p-3 text-sm text-green-800">{toast}</div>}
      {open && <Wizard onClose={() => setOpen(false)} onCreated={(inputs, ignored) => { setOpen(false); setToast(`Created run 01HZX0000000000000000000Z → would navigate to /runs/… · inputs=${JSON.stringify(inputs)} · ignored_bmns=${ignored.length}`); }} />}
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
